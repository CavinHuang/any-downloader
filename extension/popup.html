<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #f8fafc; --panel: #ffffff; --border: #e2e8f0; --border-soft: #f1f5f9;
      --text: #0f172a; --muted: #64748b; --accent: #2563eb; --accent-soft: #eff6ff;
      --ok: #16a34a; --ok-soft: #f0fdf4; --err: #dc2626; --err-soft: #fef2f2;
      --warn: #d97706; --warn-soft: #fffbeb;
      --violet: #7c3aed; --violet-soft: #f5f3ff;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1117; --panel: #171a21; --border: #262b36; --border-soft: #1e222b;
        --text: #e2e8f0; --muted: #94a3b8; --accent: #60a5fa; --accent-soft: #17233b;
        --ok: #4ade80; --ok-soft: #052e16; --err: #f87171; --err-soft: #450a0a;
        --warn: #fbbf24; --warn-soft: #451a03;
        --violet: #a78bfa; --violet-soft: #2e1065;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 408px; max-height: 560px; overflow-y: auto; margin: 0;
      font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
      color: var(--text); background: var(--bg);
    }
    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background-color: var(--border);
      border-radius: 8px;
      border: 3px solid transparent;
      background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background-color: var(--muted); }
    ::-webkit-scrollbar-button { display: none; }
    ::-webkit-scrollbar-corner { background: transparent; }

    header {
      display: flex; align-items: center; gap: 9px;
      padding: 11px 14px;
      background: var(--panel); border-bottom: 1px solid var(--border);
    }
    header img { width: 22px; height: 22px; border-radius: 6px; }
    header b { font-size: 13.5px; letter-spacing: 0.2px; }
    .pill {
      margin-left: auto; font-size: 11px; padding: 2px 10px; border-radius: 20px;
      background: var(--border-soft); color: var(--muted);
      transition: background 0.2s, color 0.2s;
    }
    .pill.ok { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
    .pill.err { background: var(--err-soft); color: var(--err); font-weight: 600; }

    .tabs2 { display: flex; gap: 4px; padding: 10px 14px 8px; }
    .tab2 {
      flex: 1; border: 1px solid var(--border); border-radius: 8px;
      background: var(--panel); padding: 5px 0; font-size: 12px; color: var(--muted);
      transition: all 0.15s;
    }
    .tab2.active {
      background: var(--accent); border-color: var(--accent);
      color: #fff; font-weight: 600;
    }

    .filters { display: flex; gap: 5px; padding: 0 14px 8px; flex-wrap: wrap; align-items: center; }
    .chip-f {
      border: 1px solid var(--border); background: var(--panel); color: var(--muted);
      border-radius: 20px; padding: 2px 11px; font-size: 11px; transition: all 0.15s;
    }
    .chip-f:hover { border-color: var(--accent); }
    .chip-f.active { color: #fff; background: var(--accent); border-color: var(--accent); }
    .chip-f.push-all { margin-left: auto; color: var(--accent); border-color: var(--accent); font-weight: 600; }
    .chip-f.push-all:hover { background: var(--accent-soft); }

    .item {
      margin: 0 10px 8px; padding: 9px 11px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      box-shadow: var(--shadow);
      transition: border-color 0.15s;
    }
    .item:hover { border-color: var(--accent); }
    .name {
      font-weight: 600; font-size: 12.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .url {
      font-size: 11px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-top: 1px;
    }
    .row1 { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .row2 { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
    .size { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .speed { font-size: 11px; color: var(--accent); font-variant-numeric: tabular-nums; }

    .tag {
      font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 5px;
      flex: none;
    }
    .tag.t-video { background: var(--accent-soft); color: var(--accent); }
    .tag.t-hls { background: var(--violet-soft); color: var(--violet); }
    .tag.t-audio { background: var(--violet-soft); color: var(--violet); }
    .tag.t-archive { background: var(--warn-soft); color: var(--warn); }
    .tag.t-binary { background: var(--err-soft); color: var(--err); }
    .tag.t-doc { background: var(--ok-soft); color: var(--ok); }
    .tag.t-file, .tag.t-segment, .tag.t-other { background: var(--border-soft); color: var(--muted); }
    .tag.t-dash { background: var(--border-soft); color: var(--muted); text-decoration: line-through; }
    .tag.s-active { background: var(--accent-soft); color: var(--accent); }
    .tag.s-done { background: var(--ok-soft); color: var(--ok); }
    .tag.s-failed { background: var(--err-soft); color: var(--err); }
    .tag.s-warn { background: var(--warn-soft); color: var(--warn); }

    .bar { height: 5px; border-radius: 3px; background: var(--border-soft); overflow: hidden; }
    .bar .fill {
      height: 100%; background: linear-gradient(90deg, var(--accent), var(--violet));
      border-radius: 3px; transition: width 0.3s;
    }
    .bar .fill.done { background: var(--ok); }
    .bar .fill.failed { background: var(--err); }

    button {
      border: 1px solid var(--border); background: var(--panel); color: var(--text);
      border-radius: 7px; padding: 3px 11px; cursor: pointer; font-size: 12px;
      transition: all 0.15s;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: 0.45; cursor: default; }
    button.primary {
      background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
    }
    button.primary:hover { opacity: 0.88; color: #fff; }
    button.pushed { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
    button.copy { font-size: 11px; padding: 2px 8px; }
    button.icon { padding: 3px 7px; font-size: 12px; }

    .section-title {
      padding: 2px 14px 6px; font-size: 11px; color: var(--muted); font-weight: 600;
    }
    .empty { padding: 28px 14px; text-align: center; color: var(--muted); }
    .takeover { padding: 9px 14px; border-top: 1px solid var(--border); font-size: 12px; background: var(--panel); }
    .error { color: var(--err); font-size: 11px; margin-top: 3px; }
    .warn-text { color: var(--warn); font-size: 11px; margin-top: 3px; }
    footer { padding: 8px 14px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); }
    .chip {
      display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
      background: var(--accent-soft); color: var(--accent);
      border-radius: 12px; padding: 1px 9px; margin: 2px 4px 0 0;
    }
    .chip button { border: none; background: none; padding: 0 2px; font-size: 11px; color: inherit; }
    .hidden { display: none; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    #tasks-stats { padding: 2px 14px 6px; font-size: 11.5px; color: var(--accent); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <img src="icons/48.png" alt="" />
    <b>Anything Downloader</b>
    <span id="status" class="pill">检查主程序…</span>
  </header>

  <div class="tabs2">
    <button id="tab-res" class="tab2 active">本页资源</button>
    <button id="tab-tasks" class="tab2">主程序任务</button>
  </div>

  <div id="res-wrap">
    <div class="filters" id="filters"></div>
    <div id="list"><div class="empty">本页暂未嗅探到资源</div></div>
  </div>
  <div id="tasks" class="hidden">
    <div id="tasks-stats"></div>
    <div id="task-list"><div class="empty">…</div></div>
  </div>

  <div class="takeover">
    <label style="display:flex;align-items:center;gap:8px;margin:0">
      <input type="checkbox" id="takeover" style="width:auto" />
      接管浏览器下载（媒体/压缩包/文档 ≥1MB）
    </label>
    <div id="takeover-info"></div>
  </div>

  <footer>右键链接 / 媒体 / 图片也可一键推送；接管失败自动放行浏览器下载</footer>
  <script src="popup.js"></script>
</body>
</html>
