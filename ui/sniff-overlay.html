<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADL</title>
    <style>
      /* 悬浮下载图标（sniff-overlay 窗口）：透明底 40x40，圆角 ⬇ 按钮。
         状态：.has 新捕获微光 / .ok 成功 / .err 失败；tip 为 1.8s 轻提示。 */
      :root { color-scheme: light; --panel:#ffffffee; --text:#243147; --border:#e3e8ef; --accent:#2865d3; --ok-bg:#eaf6f0; --ok-ink:#217d5c; --ok-border:#83c7a7; --err-bg:#fdf0f0; --err-ink:#b83a3a; --err-border:#e49b9b; }
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: dark; --panel:#1c2634ee; --text:#e0e7f2; --border:#303d50; --accent:#326bd0; --ok-bg:#203d35; --ok-ink:#83d5b1; --ok-border:#2f6d56; --err-bg:#442c35; --err-ink:#f2a4a4; --err-border:#754651; }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
        user-select: none;
      }
      #btn {
        width: 100%;
        height: 100%;
        border: none;
        border-radius: 10px;
        background: var(--panel);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(24, 36, 56, 0.28);
        outline: 1px solid var(--border);
        transition: background 0.15s ease, color 0.15s ease;
      }
      #btn:hover {
        background: var(--accent);
        color: #fff;
        outline-color: var(--accent);
      }
      #btn.has {
        box-shadow: 0 0 0 2px #79aaff, 0 4px 16px rgba(55, 121, 236, 0.5);
      }
      #btn.ok {
        background: var(--ok-bg);
        color: var(--ok-ink);
        outline-color: var(--ok-border);
      }
      #btn.err {
        background: var(--err-bg);
        color: var(--err-ink);
        outline-color: var(--err-border);
      }
      #btn:focus-visible { outline: 2px solid #79aaff; outline-offset: -3px; }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
      svg {
        display: block;
      }
      #tip {
        position: fixed;
        top: 44px;
        right: 0;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
        white-space: nowrap;
        box-shadow: 0 6px 18px rgba(24, 36, 56, 0.2);
        opacity: 0;
        transition: opacity 0.18s ease;
        pointer-events: none;
      }
      #tip.on {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <button id="btn" title="下载嗅探到的视频号视频" aria-label="下载嗅探到的视频号视频">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 12 5 5 5-5"/><path d="M5 20h14"/></svg>
    </button>
    <div id="tip" role="status"></div>
    <script type="module" src="/src/sniff-overlay.ts"></script>
  </body>
</html>
