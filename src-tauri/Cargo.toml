[package]
name = "dl-app"
version.workspace = true
edition.workspace = true
description = "Anything Downloader 桌面应用（Tauri 壳）"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
chrono = "0.4"
reqwest.workspace = true
dl-remote.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
dirs.workspace = true
dl-engine.workspace = true
dl-ipc.workspace = true
dl-net.workspace = true
dl-model.workspace = true
dl-error.workspace = true
dl-filename.workspace = true
dl-sniff.workspace = true
anyhow.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Networking_WinInet",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }
