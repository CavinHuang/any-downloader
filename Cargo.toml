[workspace]
resolver = "2"
members = [
    "crates/dl-ipc", "crates/dl-error", "crates/dl-model", "crates/dl-persist", "crates/dl-throttle",
    "crates/dl-journal", "crates/dl-segment", "crates/dl-filename", "crates/dl-net",
    "crates/dl-io", "crates/dl-engine", "crates/dl-testserver", "crates/dl-cli", "crates/dl-server", "crates/dl-ytdlp",
    "src-tauri",
]

[workspace.package]
version = "0.2.7"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
reqwest = { version = "0.12", features = ["socks", "system-proxy"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
m3u8-rs = "6"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
fs4 = "0.9"
open = "5"
# 视频号解密：必须与微信 WASM 的 Isaac64 行为逐位一致（样本对拍锁定 0.5.1）
rand_isaac = "=0.5.1"
rand_core = "0.10"

# 能力 crate（一能力一 crate，见 docs/DESIGN.md §4）
dl-ipc = { path = "crates/dl-ipc" }
dl-error = { path = "crates/dl-error" }
dl-model = { path = "crates/dl-model" }
dl-persist = { path = "crates/dl-persist" }
dl-throttle = { path = "crates/dl-throttle" }
dl-ytdlp = { path = "crates/dl-ytdlp" }
dl-journal = { path = "crates/dl-journal" }
dl-segment = { path = "crates/dl-segment" }
dl-filename = { path = "crates/dl-filename" }
dl-net = { path = "crates/dl-net" }
dl-io = { path = "crates/dl-io" }
dl-engine = { path = "crates/dl-engine" }
dl-testserver = { path = "crates/dl-testserver" }

[profile.release]
lto = "thin"
